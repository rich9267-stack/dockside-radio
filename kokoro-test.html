<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kokoro Voice Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: one column test bench — load card, voice + text card, results log */
  :root {
    --bg: #0d1517; --panel: #142226; --line: #23383d; --fg: #e8f0ef; --muted: #8fa5a6;
    --accent: #f2a541; --live: #4fd1a5; --bad: #ff8a7a;
    --display: "Archivo Narrow", "Arial Narrow", sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
    padding-block: max(20px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font: 700 1.6rem/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .92rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  label { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  select, textarea {
    width: 100%; font: 16px var(--body); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  textarea { min-height: 96px; resize: vertical; }
  button {
    font: 700 1rem var(--display); letter-spacing: .06em; text-transform: uppercase;
    border: 0; border-radius: 10px; padding: 14px 16px; min-height: 48px; cursor: pointer;
    background: var(--accent); color: #1b1206;
  }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { margin: 0; font-size: .95rem; color: var(--muted); }
  .status.ok { color: var(--live); } .status.err { color: var(--bad); }
  .bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: .92rem; font-variant-numeric: tabular-nums; }
  ol li { overflow-wrap: anywhere; }
  h2 { font: 700 .85rem var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kokoro Voice Test</h1>
    <p class="sub">Checks whether your iPhone can make DJ voices by itself. Test 1 of the Kokoro plan.</p>
  </header>

  <section class="panel">
    <button id="loadBtn">1 · Load Kokoro (about 90 MB, one time)</button>
    <div class="bar" aria-hidden="true"><div id="bar"></div></div>
    <p class="status" id="loadStatus">Use Wi-Fi for the first load. Later visits should load from Safari's saved copy.</p>
  </section>

  <section class="panel">
    <label for="voice">Host voice</label>
    <select id="voice">
      <option value="am_michael">Big Mike · Classic Rock (am_michael)</option>
      <option value="af_heart">Jess · Alternative (af_heart)</option>
      <option value="am_puck">Dusty · Country (am_puck)</option>
      <option value="am_fenrir">Static · Rap (am_fenrir)</option>
      <option value="bf_emma">Nova · Dance (bf_emma)</option>
      <option value="bm_fable">Theo · Jazz (bm_fable)</option>
      <option value="af_bella">Extra · af_bella</option>
      <option value="bm_george">Extra · bm_george</option>
    </select>
    <label for="text">What the host says</label>
    <textarea id="text">This is Static on Dockside Radio Rap. Straight out of Houston, here's the Geto Boys with My Mind Playin Tricks on Me.</textarea>
    <button id="speakBtn" disabled>2 · Make it talk</button>
    <p class="status" id="speakStatus">Load Kokoro first.</p>
    <audio id="out" playsinline></audio>
  </section>

  <section class="panel">
    <h2>Results to send Richard's team</h2>
    <ol id="log"></ol>
  </section>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const out = $("out");
  let tts = null;

  const log = (t) => { const li = document.createElement("li"); li.textContent = t; $("log").appendChild(li); };
  const setStatus = (id, t, cls) => { $(id).textContent = t; $(id).className = "status" + (cls ? " " + cls : ""); };
  const secs = (ms) => (ms / 1000).toFixed(1) + " s";

  // A tiny silent clip, played inside the tap so iPhone lets this player make sound later
  function silentWavUrl() {
    const n = 2400, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 24000, true); v.setUint32(28, 48000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  const SILENT = silentWavUrl();

  // Fallback if the library's own WAV export isn't there
  function toWavBlob(samples, rate) {
    const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
    return new Blob([buf], { type: "audio/wav" });
  }

  $("loadBtn").addEventListener("click", async () => {
    $("loadBtn").disabled = true;
    setStatus("loadStatus", "Downloading the voice engine…");
    const t0 = performance.now();
    try {
      const { KokoroTTS } = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js");
      const files = {};
      tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", {
        dtype: "q8", device: "wasm",
        progress_callback: (p) => {
          if (p.status === "progress" && p.file && p.total) {
            files[p.file] = [p.loaded, p.total];
            let l = 0, t = 0; Object.values(files).forEach(([a, b]) => { l += a; t += b; });
            $("bar").style.width = Math.round((l / t) * 100) + "%";
            setStatus("loadStatus", "Downloading… " + Math.round(l / 1e6) + " of " + Math.round(t / 1e6) + " MB");
          }
        }
      });
      $("bar").style.width = "100%";
      const took = performance.now() - t0;
      setStatus("loadStatus", "Loaded in " + secs(took) + ".", "ok");
      log("Load time: " + secs(took));
      $("speakBtn").disabled = false;
      setStatus("speakStatus", "Ready. Tap Make it talk. Try it with your Bluetooth speaker connected.");
    } catch (e) {
      setStatus("loadStatus", "Couldn't load Kokoro: " + (e && e.message ? e.message : e), "err");
      log("Load failed: " + (e && e.message ? e.message : e));
      $("loadBtn").disabled = false;
    }
  });

  $("speakBtn").addEventListener("click", async () => {
    if (!tts) return;
    // Unlock the player inside the tap
    out.src = SILENT; out.play().catch(() => {});
    $("speakBtn").disabled = true;
    const voice = $("voice").value, text = $("text").value.trim() || "Testing, one, two.";
    setStatus("speakStatus", "Making the voice…");
    const t0 = performance.now();
    try {
      const audio = await tts.generate(text, { voice });
      const took = performance.now() - t0;
      const blob = typeof audio.toBlob === "function" ? audio.toBlob() : toWavBlob(audio.audio, audio.sampling_rate);
      const length = audio.audio.length / audio.sampling_rate;
      out.src = URL.createObjectURL(blob);
      await out.play();
      setStatus("speakStatus", "Made " + length.toFixed(1) + " s of speech in " + secs(took) + ".", "ok");
      log(voice + ": " + length.toFixed(1) + " s of speech took " + secs(took) + " to make");
    } catch (e) {
      setStatus("speakStatus", "Couldn't make the voice: " + (e && e.message ? e.message : e), "err");
      log("Speak failed (" + voice + "): " + (e && e.message ? e.message : e));
    }
    $("speakBtn").disabled = false;
  });
</script>
</body>
</html>
