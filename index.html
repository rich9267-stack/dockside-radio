<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dockside Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: one column, a radio "dial" card for now-playing, controls below, log at bottom */
  :root {
    --bg: #0d1517;
    --panel: #142226;
    --line: #23383d;
    --fg: #e8f0ef;
    --muted: #8fa5a6;
    --accent: #f2a541;
    --live: #4fd1a5;
    --display: "Archivo Narrow", "Arial Narrow", sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
    padding-block: max(20px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font: 700 1.6rem/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
  .freq { font: 500 .85rem var(--display); color: var(--accent); letter-spacing: .12em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  label { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  input {
    width: 100%; font: 16px var(--body); color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: 700 1rem var(--display); letter-spacing: .06em; text-transform: uppercase;
    border: 0; border-radius: 10px; padding: 14px 16px; cursor: pointer;
    background: var(--accent); color: #1b1206; min-height: 48px;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .msg { font-size: .9rem; color: var(--muted); margin: 0; min-height: 1.4em; }
  .msg.err { color: #ff8a7a; }
  .onair { display: flex; align-items: center; gap: 8px; font: 700 .8rem var(--display); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .playing .dot { background: var(--live); box-shadow: 0 0 10px var(--live); }
  .playing .onair { color: var(--live); }
  .title { font: 700 1.35rem/1.2 var(--display); margin: 0; overflow-wrap: anywhere; }
  .artist { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  .video { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .video > div, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: .92rem; }
  ol li { overflow-wrap: anywhere; }
  ol li span { color: var(--muted); }
  h2 { font: 700 .85rem var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dockside Radio</h1>
    <span class="freq">V1.3 · PLAYER TEST</span>
  </header>

  <section class="panel" id="setup">
    <label for="link">YouTube Music playlist link</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://music.youtube.com/playlist?list=...">
    <button id="load">Start the station</button>
    <button class="ghost" id="sample">Test with YouTube's sample video</button>
    <p class="msg" id="setupMsg">Paste a playlist set to Unlisted or Public, then tap Start.</p>
  </section>

  <section class="panel" id="station" hidden>
    <div class="onair"><span class="dot"></span><span id="status">Tuning in</span></div>
    <div>
      <p class="title" id="title">Loading…</p>
      <p class="artist" id="artist"></p>
      <p class="count" id="count"></p>
    </div>
    <div class="video"><div id="player"></div></div>
    <div class="row">
      <button class="ghost" id="prev">Back</button>
      <button id="toggle">Pause</button>
      <button class="ghost" id="next">Skip</button>
    </div>
    <button class="ghost" id="change">Change playlist</button>
  </section>

  <section class="panel" id="logBox" hidden>
    <h2>Played this session</h2>
    <ol id="log"></ol>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var player = null, apiReady = false, pendingList = null, lastId = null, errRun = 0;

  // Remember the last playlist link on this phone
  try { var saved = localStorage.getItem("dj-playlist"); if (saved) $("link").value = saved; } catch (e) {}

  function playlistId(text) {
    var m = String(text).match(/[?&]list=([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{12,}$/.test(text.trim())) return text.trim();
    return null;
  }

  function setMsg(t, err) { $("setupMsg").textContent = t; $("setupMsg").className = err ? "msg err" : "msg"; }

  // Load YouTube's official player script
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { setMsg("Couldn't reach YouTube. Check your connection and reload.", true); };
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    if (pendingList) startPlayer(pendingList);
  };

  $("load").addEventListener("click", function () {
    var id = playlistId($("link").value);
    if (!id) { setMsg("That doesn't look like a playlist link. It should contain list= in it.", true); return; }
    try { localStorage.setItem("dj-playlist", $("link").value.trim()); } catch (e) {}
    $("setup").hidden = true; $("station").hidden = false;
    if (apiReady) startPlayer(id); else pendingList = id;
  });

  // Diagnostic: YouTube's own developer sample video, which allows embedding
  var SAMPLE = "M7lc1UVf-VE";
  $("sample").addEventListener("click", function () {
    $("setup").hidden = true; $("station").hidden = false;
    if (apiReady) startPlayer(null, SAMPLE); else pendingList = "video:" + SAMPLE;
  });

  function startPlayer(listId, videoId) {
    if (listId && listId.indexOf("video:") === 0) { videoId = listId.slice(6); listId = null; }
    if (player) {
      if (videoId) player.loadVideoById(videoId);
      else player.loadPlaylist({ list: listId, listType: "playlist", index: 0 });
      return;
    }
    var vars = { playsinline: 1, autoplay: 1, rel: 0, origin: location.origin };
    if (!videoId) { vars.listType = "playlist"; vars.list = listId; }
    player = new YT.Player("player", {
      videoId: videoId || undefined,
      playerVars: vars,
      events: {
        onReady: function (e) { e.target.playVideo(); },
        onStateChange: onState,
        onError: onErr
      }
    });
  }

  function onState(e) {
    var s = e.data;
    document.body.classList.toggle("playing", s === YT.PlayerState.PLAYING);
    $("status").textContent = s === YT.PlayerState.PLAYING ? "On air" :
                              s === YT.PlayerState.PAUSED ? "Paused" :
                              s === YT.PlayerState.BUFFERING ? "Tuning in" : "Standing by";
    $("toggle").textContent = s === YT.PlayerState.PLAYING ? "Pause" : "Play";
    if (s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING) showSong();
  }

  function showSong() {
    var d = player.getVideoData ? player.getVideoData() : null;
    if (!d || !d.video_id || d.video_id === lastId) return;
    lastId = d.video_id; errRun = 0;
    var artist = (d.author || "").replace(/ - Topic$/, "");
    $("title").textContent = d.title || "Unknown song";
    $("artist").textContent = artist;
    var list = player.getPlaylist() || [], i = player.getPlaylistIndex();
    $("count").textContent = list.length ? "Song " + (i + 1) + " of " + list.length : "";
    var li = document.createElement("li");
    li.textContent = (d.title || "Unknown song") + " ";
    var sp = document.createElement("span"); sp.textContent = artist; li.appendChild(sp);
    $("log").appendChild(li); $("logBox").hidden = false;
  }

  function onErr(e) {
    // 101/150: owner blocks playback outside YouTube; skip it
    // 100: private or removed. 101/150: owner blocks playback outside YouTube.
    errRun++;
    var why = e.data === 100 ? "private or removed" :
              (e.data === 101 || e.data === 150) ? "blocked outside YouTube" : "playback problem";
    if (errRun >= 5) {
      $("status").textContent = "Stopped: 5 songs in a row failed (code " + e.data + ", " + why + ")";
      return;
    }
    $("status").textContent = "Song " + why + " (code " + e.data + "), skipping";
    setTimeout(function () { player.nextVideo(); }, 1500);
  }

  $("toggle").addEventListener("click", function () {
    if (!player) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
  });
  $("next").addEventListener("click", function () { if (player) player.nextVideo(); });
  $("prev").addEventListener("click", function () { if (player) player.previousVideo(); });
  $("change").addEventListener("click", function () {
    if (player) player.pauseVideo();
    $("station").hidden = true; $("setup").hidden = false;
  });
})();
</script>
</body>
</html>
